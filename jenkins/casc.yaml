jenkins:
  systemMessage: "To do App CI/CD Jenkins"

  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - script: >
      job('seed-job') {
        description('Seed job to create Jenkins jobs from Job DSL')

        scm {
          git {
            remote {
              url('https://github.com/raghucraft/todo-app-k8s.git')
            }
            branch('*/main')
          }
        }

        steps {
          dsl {
            targets('jenkins/jobs/seed.groovy')
            removeAction('IGNORE')
            removeViewAction('IGNORE')
          }
        }
      }