apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: {{ .Values.namespace }}
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: todo
      component: mongodb
  template:
    metadata:
      labels:
        app: todo
        component: mongodb
    spec:
      containers:
        - name: mongodb
          image: "mongo:{{ .Values.mongodb.tag}}"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb-storage
      spec:
        accessModes: 
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.mongodb.storage }}
