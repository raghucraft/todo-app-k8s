apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend
  namespace: {{ .Values.namespace }}
  labels: 
    app: todo
    component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: todo
      component: frontend
  template:
    metadata:
      labels:
        app: todo
        component: frontend
    spec:
      containers: 
      - name: docker-to-do-frontend 
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80

